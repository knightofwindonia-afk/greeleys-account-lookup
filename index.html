<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account Lookup</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:#111827}
.wrap{max-width:820px;margin:0 auto;padding:12px}
.searchbox{position:relative}
input{width:100%;font-size:24px;line-height:1.3;padding:20px 58px 20px 22px;border:2px solid #cbd5e1;border-radius:18px;outline:none;box-shadow:0 3px 12px rgba(0,0,0,.08)}
input:focus{border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.12)}
.clear{position:absolute;right:14px;top:50%;transform:translateY(-50%);border:0;background:#f1f5f9;border-radius:999px;width:38px;height:38px;font-size:22px;cursor:pointer;display:none}
.hint{font-size:15px;color:#64748b;margin:10px 4px 0}
.status{margin-top:14px;border-radius:14px;padding:14px 16px;font-weight:700;display:none}
.status.ok{display:block;background:#dcfce7;color:#166534}
.status.none{display:block;background:#fee2e2;color:#991b1b}
.results{margin-top:10px;border:1px solid #e2e8f0;border-radius:14px;overflow:hidden;display:none}
.row{padding:15px 16px;border-bottom:1px solid #e2e8f0;font-size:19px;font-weight:650}
.row:last-child{border-bottom:0}
.exact{background:#f0fdf4}
.more{padding:11px 16px;background:#f8fafc;color:#64748b;font-size:14px}
@media(max-width:520px){.wrap{padding:8px} input{font-size:22px;padding:18px 54px 18px 18px;border-radius:16px} .row{font-size:18px;padding:14px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="searchbox">
    <input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="characters" placeholder="Search company name…">
    <button id="clear" class="clear" aria-label="Clear search">×</button>
  </div>
  <div class="hint">Type any part of the name — for example: RYDER, PENSKE, UPS, WALMART.</div>
  <div id="status" class="status"></div>
  <div id="results" class="results"></div>
</div>

NATIONAL TRUCK SERVICE", "NE MOTOR FREIGHT", "NE PLUMBING & HEATING", "NE TRUCK AND TIRE", "NESS", "NEW ENGLAND KENWORTH", "NEW ENGLAND PUBLIC WAREHOUSE", "NEW ENGLAND TRUCK TIRE", "NEW PENN MOTOR EXPRESS", "NITCO", "NORTH AMERICAN VAN LINES", "NORTHEAST CHARTER & TOUR", "NORTHEAST EMERGENCY", "NORTHEAST GREAT DANE", "NORTHEAST MECH. CONTRACT", "NORTHEAST TRAFFIC", "O'CONNOR", "OLD CASTLE", "ONSITE FLEET SERVICES", "ORIGINAL PIZZA OF BOSTON", "P&K SAND & GRAVEL", "PACCAR CENTRAL", "PAM TRANSPORT", "PAN-AM RAILROAD", "PARIS FARMERS UNION", "PENSKE AUBURN", "PENSKE FLEET MANAGEMENT", "PENSKE PORTLAND (OLD KRISWAY)", "PENSKE ROAD SERVICE", "PENSKE SCARBOROUGH", "PENSKE SOUTH PORTLAND", "PEPSI", "PERRY TRANSPORT", "PICKARD TRANSPORT", "PINE STATE TRADING / BEVERAGE", "PINE TREE FOODS", "PINE TREE WASTE", "PINELAND FARMS", "PIONEER PLASTIC", "PITSTOP FUELS", "PLATZ, CANDY", "POLAND SPRINGS", "POTTLES", "PRATT & SONS", "PREMIER RENTAL", "PRIME", "QUEST TOWING", "R.C. MOORE", "RANDY'S", "REGENCY", "RESOURCE (RE-ENERGY)", "RICHARD CARRIER TRUCKING", "RICKER HILL ORCHARDS", "RIPLEY & FLETCHER", "ROCKINGHAM ELECTRICAL", "ROEHL TRANSPORT", "ROSS EXPRESS", "ROWE", "ROWE WESTBROOK", "RYDER - LEWISTON", "RYDER - PORTLAND", "RYDER CUSTOMER RESPONSE", "RYDER/LYNCH/HERMAN", "SAD52", "SAIL ENERGY", "SAM'S ITALIAN BAKERY", "SARAH FRYE", "SAVAGE SAFE HANDLING", "SEABREEZE", "SERVICE MASTER", "SERVPRO", "SHAW BROTHERS", "SIMARD AND SON", "SMITH TRANSPORTATION", "SOUTHERN MAINE AUTO ACT", "SPC", "SPENCER GROUP PAVING", "ST. LAWRENCE RAILROAD", "ST. MARYS", "STAR LEASING", "STATION CLASS CONSTRUCTORS", "SULLIVAN & MERRITT", "SUNCO WELL DRILLING", "SUPERIOR CARRIERS / HENIFF", "SUPERIOR CONCRETE", "SUPERIOR PROPANE", "SWAN'S CONCRETE", "SWIFT", "TEN LEASING", "THAYER CORPORATION", "THE TOWING NETWORK", "THOMPSON EQUIPMENT", "TMC", "TOWN FAIR TIRE", "TOWN OF FREEPORT", "TOWN OF GREENE", "TOWN OF SABATTUS", "TOWN OF TURNER", "TRAC INTER STAR", "TRANSIT PROS", "TRI-STATE STEEL", "TROIANO WAST const q=document.getElementById('q'), status=document.getElementById('status'), results=document.getElementById('results'), clear=document.getElementById('clear');

function norm(s){
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');
}
function compact(s){ return norm(s).replace(/\s/g,''); }
function lev(a,b){
  if(a===b) return 0;
  if(!a.length) return b.length; if(!b.length) return a.length;
  const v=Array(b.length+1).fill(0).map((_,i)=>i);
  for(let i=1;i<=a.length;i++){
    let prev=v[0]; v[0]=i;
    for(let j=1;j<=b.length;j++){
      const old=v[j], cost=a[i-1]===b[j-1]?0:1;
      v[j]=Math.min(v[j]+1,v[j-1]+1,prev+cost);
      prev=old;
    }
  }
  return v[b.length];
}
function tokenNear(query, name){
  if(query.length<4) return false;
  const qt=norm(query).split(' ');
  const nt=norm(name).split(' ');
  return qt.every(x=>nt.some(y=>y.startsWith(x)||x.startsWith(y)||(Math.abs(x.length-y.length)<=2 && lev(x,y)<=2)));
}
function rank(name, query){
  const n=norm(name), c=compact(name), nq=norm(query), cq=compact(query);
  if(!nq) return 999;
  if(n===nq || c===cq) return 0;
  if(n.startsWith(nq)||c.startsWith(cq)) return 1;
  if(n.split(' ').some(w=>w.startsWith(nq))) return 2;
  if(n.includes(nq)||c.includes(cq)) return 3;
  if(tokenNear(query,name)) return 4;
  return 999;
}
function render(){
  const query=q.value.trim();
  clear.style.display=query?'block':'none';
  if(!query){
    status.className='status'; status.textContent='';
    results.style.display='none'; results.innerHTML=''; return;
  }
  const found=companies.map(name=>({name,score:rank(name,query)})).filter(x=>x.score<999)
    .sort((a,b)=>a.score-b.score||a.name.localeCompare(b.name));
  const exact=found.filter(x=>x.score===0);
  if(found.length){
    status.className='status ok';
    status.textContent= exact.length ? '✓ EXACT ACCOUNT MATCH' : `✓ ${found.length} MATCH${found.length===1?'':'ES'} FOUND`;
    const show=found.slice(0,20);
    results.innerHTML=show.map(x=>`<div class="row ${x.score===0?'exact':''}">${x.name.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>`).join('') +
      (found.length>20?`<div class="more">Showing first 20 of ${found.length} matches. Type more letters to narrow the list.</div>`:'');
    results.style.display='block';
  } else {
    status.className='status none';
    status.textContent='NO MATCH FOUND IN ACCOUNT LIST — try fewer letters or check the spelling.';
    results.style.display='none'; results.innerHTML='';
  }
}
q.addEventListener('input',render);
clear.addEventListener('click',()=>{q.value='';render();q.focus();});
</script>
</body>
</html>
